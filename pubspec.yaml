name: recipe_app
description: "A Flutter recipe app with local persistence and online recipe search."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  get: ^4.7.2
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  retrofit: ^4.4.2
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  retrofit_generator: ^10.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/recipetypes.json
